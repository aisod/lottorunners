<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#005d98" />
    <title>Lotto Runners — Offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #f9f9ff;
        color: #0f172a;
        padding: 1.5rem;
      }
      main {
        max-width: 28rem;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.5rem;
        color: #005d98;
      }
      p {
        margin: 0 0 1.25rem;
        line-height: 1.5;
        color: #475569;
      }
      button {
        border: 0;
        border-radius: 9999px;
        background: #005d98;
        color: #fff;
        font-weight: 600;
        padding: 0.75rem 1.25rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You&apos;re offline</h1>
      <p>
        Lotto Runners needs a connection for live matching and tracking. Your cached app shell is
        available — reconnect and try again.
      </p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
